name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # CPU wheels first so requirements.txt's torch==2.8.0 pin is already
      # satisfied and pip does not pull the 2 GB CUDA build.
      - run: pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - run: python check_env.py --deploy || python check_env.py
      - run: python -m pytest
